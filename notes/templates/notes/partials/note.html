<div id="note-{{ note.id }}"
    class="bg-white p-4 rounded-lg shadow-sm border border-gray-200 transition-all hover:shadow-md"
    x-data="{ editing: false }">

    <!-- View Mode -->
    <div x-show="!editing">
        <p class="text-gray-800 whitespace-pre-wrap">{{ note.content }}</p>
        <div class="mt-2 flex justify-between items-center text-xs text-gray-400">
            <span>{{ note.created_at|date:"M d, Y H:i" }}</span>
            <div class="space-x-2">
                <button @click="editing = true" class="text-indigo-600 hover:text-indigo-800 font-medium">
                    Edit
                </button>
                <button hx-delete="{% url 'delete_note' note.id %}" hx-target="#note-{{ note.id }}" hx-swap="delete"
                    hx-confirm="Are you sure?" class="text-red-500 hover:text-red-700 font-medium">
                    Delete
                </button>
            </div>
        </div>
    </div>

    <!-- Edit Mode -->
    <form x-show="editing" hx-post="{% url 'edit_note' note.id %}" hx-target="#note-{{ note.id }}" hx-swap="outerHTML"
        class="space-y-2">
        <textarea name="content"
            class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all resize-none"
            rows="3">{{ note.content }}</textarea>
        <div class="flex justify-end space-x-2">
            <button type="button" @click="editing = false"
                class="px-3 py-1 text-sm text-gray-600 hover:bg-gray-100 rounded">
                Cancel
            </button>
            <button type="submit" class="px-3 py-1 text-sm bg-indigo-600 text-white rounded hover:bg-indigo-700">
                Save
            </button>
        </div>
    </form>
</div>
