<form hx-post="{% url 'add_note' %}" hx-target="#notes-list" hx-swap="afterbegin" hx-on::after-request="this.reset()">
    <textarea name="content"
        class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all resize-none"
        placeholder="Write a note..." rows="3" required></textarea>
    <div class="mt-3 flex justify-end">
        <button type="submit"
            class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors font-medium text-sm shadow-sm hover:shadow">
            Add Note
        </button>
    </div>
</form>
